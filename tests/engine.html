<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Engine-Test</title>
<style>body { font: 17px/1.4 monospace; margin: 10px; white-space: pre; }</style>
</head>
<body>
<div id="out">läuft…</div>
<script src="harness.js"></script>
<script src="../js/cube-state.js"></script>
<script>
(function () {
  var C = ZW.Cube;

  function facStr(f) {
    var out = [];
    for (var i = 0; i < 6; i++) {
      var row = '';
      for (var j = 0; j < 9; j++) row += f[i * 9 + j];
      out.push(C.FACES[i] + ':' + row);
    }
    return out.join(' ');
  }
  function facEq(a, b) { for (var i = 0; i < 54; i++) if (a[i] !== b[i]) return false; return true; }
  function stEq(a, b) {
    for (var i = 0; i < 8; i++) if (a.cp[i] !== b.cp[i] || a.cr[i] !== b.cr[i]) return false;
    for (var j = 0; j < 12; j++) if (a.ep[j] !== b.ep[j] || a.er[j] !== b.er[j]) return false;
    return true;
  }
  function seq(names) { var s = new C.State(); C.applyMoves(s, names); return s; }
  function randGen(seed) {
    var r = seed;
    return function () { r = (r * 1103515245 + 12345) & 0x7fffffff; return r / 0x7fffffff; };
  }

  T.info('Drehungen ' + C.ROTATIONS.length + ' · Züge ' + C.MOVE_NAMES.length);
  T.log('Facelet-Farben des gelösten Würfels stimmen',
    facStr(C.toFacelets(new C.State())) === 'U:000000000 R:111111111 F:222222222 D:333333333 L:444444444 B:555555555');

  // Identitäten
  var id = new C.State(), idOk = true;
  [['U U U2', ['U', 'U', 'U2']], ['U x4', ['U', 'U', 'U', 'U']],
   ["F B' F' B", ['F', "B'", "F'", 'B']], ["(R U R' U') x6",
     ['R', 'U', "R'", "U'", 'R', 'U', "R'", "U'", 'R', 'U', "R'", "U'",
      'R', 'U', "R'", "U'", 'R', 'U', "R'", "U'", 'R', 'U', "R'", "U'"]]
  ].forEach(function (t) { if (!stEq(seq(t[1]), id)) { idOk = false; T.info('Identität verletzt: ' + t[0]); } });
  T.log('Standard-Identitäten gelten', idOk);

  // Facelet-Permutation == Cubie-Modell, für alle 18 Züge
  var permOk = true;
  for (var m = 0; m < 18; m++) {
    var st = new C.State();
    C.applyMoveIdx(st, m);
    var base = C.toFacelets(new C.State()), p = C.PERM[m], nf = new Int8Array(54);
    for (var k = 0; k < 54; k++) nf[p[k]] = base[k];
    if (!facEq(nf, C.toFacelets(st))) { permOk = false; T.info('Abweichung bei ' + C.MOVE_NAMES[m]); }
  }
  T.log('Facelet-Permutation == Cubie-Modell (18 Züge)', permOk);

  // Jeder Zug bewegt genau 4 Ecken und 4 Kanten
  var cntOk = true;
  for (var m2 = 0; m2 < 18; m2++) {
    var s2 = new C.State();
    C.applyMoveIdx(s2, m2);
    var mc = 0, me = 0;
    for (var i = 0; i < 8; i++) if (s2.cp[i] !== i) mc++;
    for (var j = 0; j < 12; j++) if (s2.ep[j] !== j) me++;
    if (mc !== 4 || me !== 4) { cntOk = false; T.info(C.MOVE_NAMES[m2] + ': ' + mc + ' Ecken, ' + me + ' Kanten'); }
  }
  T.log('Jeder Zug bewegt 4 Ecken und 4 Kanten', cntOk);

  // Zufallsozustände: Gesetzmäßigkeiten
  var rnd = randGen(20261125), states = [];
  var bad = { tw: 0, fl: 0, par: 0, solvable: 0 };
  for (var t = 0; t < 500; t++) {
    var s3 = new C.State();
    for (var q = 0; q < 30; q++) C.applyMoveIdx(s3, Math.floor(rnd() * 18));
    states.push(s3);
    if (C.twistSum(s3) !== 0) bad.tw++;
    if (C.flipSum(s3) !== 0) bad.fl++;
    var pa = C.parityOf(s3);
    if (pa.corners !== pa.edges) bad.par++;
  }
  T.log('Twistsumme mod 3 = 0 (500 Zufallswürfel)', bad.tw === 0);
  T.log('Flipsumme mod 2 = 0 (500 Zufallswürfel)', bad.fl === 0);
  T.log('Parität Ecke = Parität Kante (500 Zufallswürfel)', bad.par === 0);

  // Koordinaten müssen zugweise wohldefiniert sein
  function wellDefined(fn, name, moves) {
    var map = {}, conflicts = 0;
    for (var a = 0; a < states.length; a++) {
      for (var b = 0; b < moves.length; b++) {
        var m3 = moves[b], c1 = fn(states[a]);
        var s4 = states[a].clone();
        C.applyMoveIdx(s4, m3);
        var key = c1 + ':' + m3, v = fn(s4);
        if (key in map) { if (map[key] !== v) conflicts++; } else map[key] = v;
      }
    }
    T.log('Koordinate ' + name + ' wohldefiniert', conflicts === 0);
  }
  var all = [], g1 = [C.moveIndex('U', 1), C.moveIndex('U', 2), C.moveIndex('D', 1), C.moveIndex('D', 2),
                      C.moveIndex('R', 2), C.moveIndex('L', 2), C.moveIndex('F', 2), C.moveIndex('B', 2)];
  for (var mm = 0; mm < 18; mm++) all.push(mm);
  wellDefined(C.twistCoord, 'twist', all);
  wellDefined(C.flipCoord, 'flip', all);
  wellDefined(C.sliceCoord, 'slice', all);
  wellDefined(C.cornerPermIndex, 'cornerPerm', all);
  wellDefined(C.edgeUDPermIndex, 'edgeUDPerm', g1);   // nur innerhalb G1 gültig
  wellDefined(C.slicePermIndex, 'slicePerm', g1);     // nur innerhalb G1 gültig

  // twist-/flip-erhaltende Züge müssen den G1-Erzeugern entsprechen.
  // Das ist nur vom gelösten Würfel aus sinnvoll (bei beliebigen Zuständen
  // hängt die Liste von der momentanen Drehung der Steine ab).
  var st0 = new C.State(), keepTw = [], keepFl = [];
  for (var m4 = 0; m4 < 18; m4++) {
    var s5 = st0.clone();
    C.applyMoveIdx(s5, m4);
    if (C.twistCoord(s5) === C.twistCoord(st0)) keepTw.push(C.MOVE_NAMES[m4]);
    if (C.flipCoord(s5) === C.flipCoord(st0)) keepFl.push(C.MOVE_NAMES[m4]);
  }
  T.info('twist-erhaltend: ' + keepTw.join(' '));
  T.info('flip-erhaltend:  ' + keepFl.join(' '));
  T.log('twist-erhaltende Züge = G1-Erzeuger', keepTw.length === 10);
  T.log('flip-erhaltende Züge = U,D,R,L (alle) + F2,B2', keepFl.length === 14);

  T.log('parseAlg', JSON.stringify(C.parseAlg("R U R' U2 F’")) === JSON.stringify(['R', 'U', "R'", 'U2', "F'"]));
  T.log('invertMoves', JSON.stringify(C.invertMoves(['R', 'U2', "F'"])) === JSON.stringify(['F', 'U2', "R'"]));
  T.done();
})();
</script>
</body>
</html>
